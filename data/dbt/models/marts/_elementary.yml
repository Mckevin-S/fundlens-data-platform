# Supervision Elementary (cibles BigQuery et Snowflake ; nécessite `dbt deps`)
version: 2

models:
  - name: fct_nav
    tests:
      - elementary.volume_anomalies:
          timestamp_column: as_of
          config: {enabled: "{{ target.type in ['bigquery', 'snowflake'] }}"}
      - elementary.column_anomalies:
          column_anomalies: [average, zero_count]
          timestamp_column: as_of
          config: {enabled: "{{ target.type in ['bigquery', 'snowflake'] }}"}
