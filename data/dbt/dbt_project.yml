name: fundlens
version: "0.1.0"
config-version: 2
profile: fundlens

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  fundlens:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
  elementary:
    +schema: elementary
    +enabled: "{{ target.type in ['bigquery', 'snowflake'] }}"

seeds:
  fundlens:
    +schema: raw
