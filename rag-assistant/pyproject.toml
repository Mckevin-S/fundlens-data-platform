[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistant"
version = "0.1.0"
description = "Assistant RAG sur les prospectus des fonds, avec un outil qui interroge fund-api (LLM local Ollama)."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.32", "httpx>=0.27,<0.28", "langchain-text-splitters>=0.3,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_assistant --cov-report=term-missing --cov-fail-under=85"
