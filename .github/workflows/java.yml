name: java
on:
  push: { paths: ["fund-api/**", "legacy-backoffice/**", ".github/workflows/java.yml"] }
  pull_request: { paths: ["fund-api/**", "legacy-backoffice/**"] }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { module: [fund-api, legacy-backoffice] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Tests unitaires et d'intégration (Testcontainers)
        run: mvn -B -f ${{ matrix.module }}/pom.xml verify
