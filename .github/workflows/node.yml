name: node
on:
  push: { paths: ["portal-bff/**", "investor-portal/**", "cockpit/**", "e2e/**", ".github/workflows/node.yml"] }
  pull_request: { paths: ["portal-bff/**", "investor-portal/**", "cockpit/**", "e2e/**"] }
permissions: { contents: read }
jobs:
  portal-bff:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: portal-bff } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: portal-bff/package-lock.json }
      - run: npm ci && npm run lint && npm test && npm run test:e2e && npm run build
  investor-portal:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: investor-portal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: investor-portal/package-lock.json }
      - run: npm ci && npm test && npm run build
  cockpit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cockpit } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: cockpit/package-lock.json }
      - run: npm ci && npx ng test --watch=false && npx ng build
  e2e:
    runs-on: ubuntu-latest
    needs: [investor-portal, cockpit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: (cd investor-portal && npm ci && npm run build) && (cd cockpit && npm ci && npx ng build)
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium && npx playwright test
